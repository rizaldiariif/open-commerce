<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MUSE Screenshot Cropper</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        overflow: hidden;
        background: #fff;
      }

      img {
        display: block;
        height: auto;
        left: 0;
        max-width: none;
        position: absolute;
        top: 0;
        width: auto;
      }
    </style>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(window.location.search);
      const image = document.createElement("img");
      image.alt = "Crop source";
      image.src = params.get("src") || "";
      image.style.left = `${-Number(params.get("x") || 0)}px`;
      image.style.top = `${-Number(params.get("y") || 0)}px`;
      document.body.append(image);
    </script>
  </body>
</html>
